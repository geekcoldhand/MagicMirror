<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emergency Test - MagicMirror</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .region {
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .region.top {
      display: flex;
      justify-content: space-between;
    }
    
    .top_left, .top_right {
      flex: 1;
    }
    
    .top_bar {
      width: 100%;
      text-align: center;
    }
    
    .clock {
      color: white;
    }
    
    .time {
      font-size: 75px;
      font-weight: 300;
      line-height: 1;
    }
    
    .date {
      font-size: 24px;
      opacity: 0.7;
      margin-top: 10px;
    }
    
    .alert {
      color: lime;
      font-size: 20px;
      padding: 10px;
      background: rgba(0,255,0,0.1);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="region top_bar">
      <div class="alert" id="alert-module">✓ System Loaded</div>
    </div>
    
    <div class="region top">
      <div class="top_left">
        <div class="clock" id="clock-module">
          <div class="time" id="time">--:--</div>
          <div class="date" id="date">Loading...</div>
        </div>
      </div>
      
      <div class="top_right">
        <div id="status" style="color: cyan; font-size: 24px;">
          <div>Emergency Test Page</div>
          <div style="margin-top: 10px; font-size: 18px;" id="module-status">Initializing...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('=== EMERGENCY TEST STARTING ===');
    
    // Update clock every second
    function updateClock() {
      const now = new Date();
      
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      
      // Convert to 12-hour format
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      
      const timeString = 
        (hours < 10 ? '0' : '') + hours + ':' +
        (minutes < 10 ? '0' : '') + minutes + ':' +
        (seconds < 10 ? '0' : '') + seconds + ' ' + ampm;
      
      document.getElementById('time').textContent = timeString;
      
      // Update date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateString = now.toLocaleDateString('en-US', options);
      document.getElementById('date').textContent = dateString;
    }
    
    // Update immediately
    updateClock();
    
    // Update every second
    setInterval(updateClock, 1000);
    
    console.log('=== Clock update started ===');
    
    // Test loading config
    fetch('/config')
      .then(response => response.json())
      .then(config => {
        console.log('=== Config loaded:', config);
        document.getElementById('module-status').innerHTML = 
          '✓ Config loaded<br>' +
          '✓ Modules: ' + (config.modules ? config.modules.length : 0);
      })
      .catch(error => {
        console.error('=== Config load failed:', error);
        document.getElementById('module-status').innerHTML = 
          '✗ Config failed to load<br>' +
          'Error: ' + error.message;
        document.getElementById('module-status').style.color = 'red';
      });
    
    console.log('=== EMERGENCY TEST COMPLETE ===');
  </script>
</body>
</html>
