<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicMirror²</title>
  
  <link rel="stylesheet" type="text/css" href="/css/main.css">
  <link rel="stylesheet" type="text/css" href="/css/custom.css">
  
</head>
<body>
  <div class="container">
    <div class="region top bar">
      <div class="region top_bar"></div>
    </div>
    
    <div class="region top">
      <div class="region top_left"></div>
      <div class="region top_center"></div>
      <div class="region top_right"></div>
    </div>
    
    <div class="region upper">
      <div class="region upper_third"></div>
    </div>
    
    <div class="region middle">
      <div class="region middle_center"></div>
    </div>
    
    <div class="region lower">
      <div class="region lower_third"></div>
    </div>
    
    <div class="region bottom">
      <div class="region bottom_left"></div>
      <div class="region bottom_center"></div>
      <div class="region bottom_right"></div>
    </div>
    
    <div class="region bottom bar">
      <div class="region bottom_bar"></div>
    </div>
  </div>
  
     <script src="/socket.io/socket.io.js"></script>
  <script src="/js/module.js"></script>
  <script src="/js/socketclient.js"></script>
  <script src="/js/loader.js"></script>
  <script src="/js/main.js"></script>

</html>
